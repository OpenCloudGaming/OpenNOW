[workspace]
members = [
    "crates/opennow-streamer",
    "crates/opennow-streamer-core",
    "crates/opennow-streamer-platform",
    "crates/opennow-streamer-platform-macos",
    "crates/opennow-streamer-protocol",
    "crates/opennow-streamer-transport",
]
default-members = ["crates/opennow-streamer"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
audiopus_sys = { version = "0.2.2", features = ["static"] }
base64 = "0.22"
ctr = "0.9"
crc32fast = "1"
getrandom = "0.3"
ghash = "0.5"
hmac = "0.12"
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
opus = "0.3.1"
sdl2 = { version = "0.38.0", default-features = false, features = ["bundled", "raw-window-handle", "static-link", "unsafe_textures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
str0m = { version = "0.23", default-features = false }
subtle = "2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
