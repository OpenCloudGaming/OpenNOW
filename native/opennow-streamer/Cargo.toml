[workspace]
members = [
    "crates/opennow-awdl-helper",
    "crates/opennow-streamer",
    "crates/opennow-streamer-core",
    "crates/opennow-streamer-ffi",
    "crates/opennow-streamer-hid",
    "crates/opennow-streamer-platform",
    "crates/opennow-streamer-platform-linux",
    "crates/opennow-streamer-platform-macos",
    "crates/opennow-streamer-platform-windows",
    "crates/opennow-streamer-protocol",
    "crates/opennow-streamer-transport",
]
default-members = ["crates/opennow-streamer"]
exclude = ["vendor/cros-codecs-extended"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
audiopus_sys = { version = "0.2.2", features = ["static"] }
base64 = "0.22"
ctr = "0.9"
crc32fast = "1"
getrandom = "0.3"
ghash = "0.5"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "png"] }
mtu = "0.3"
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
oxideav-core = "0.1.34"
oxideav-mkv = "0.0.9"
opus = "0.3.1"
sdl2 = { version = "0.38", default-features = false, features = ["raw-window-handle", "unsafe_textures", "use-pkgconfig"] }
scuffle-av1 = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
str0m = { version = "0.23", default-features = false }
subtle = "2"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
str0m = { path = "vendor/str0m" }
# Always compile the vendored Opus sources for the distributable streamer.
audiopus_sys = { path = "vendor/audiopus-sys" }
# Upstream does not expose an NVDEC-only bundled build. This patch keeps CUDA
# and nvcuvid as driver-loaded interfaces without requiring the CUDA toolkit.
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }
cros-codecs-extended = { path = "vendor/cros-codecs-extended" }
