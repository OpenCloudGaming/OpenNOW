[package]
name = "opennow-core"
version = "0.5.4"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
md5 = "0.7"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scrypt = "0.11"
subtle = "2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
