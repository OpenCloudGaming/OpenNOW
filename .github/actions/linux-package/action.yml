name: Package and verify Linux applications
description: Build and smoke-test the AppImage and bundled DEB from the same validated release tree
inputs:
  arch:
    description: Target architecture, x86_64 or aarch64
    required: true
  channel:
    description: Update channel
    required: true
runs:
  using: composite
  steps:
    - name: Create Linux AppImage
      if: runner.os == 'Linux'
      shell: bash
      env:
        APPIMAGE_EXTRACT_AND_RUN: "1"
        EXTRA_PLATFORM_PLUGINS: libqoffscreen.so;libqwayland-egl.so;libqwayland-generic.so
        EXTRA_QT_MODULES: waylandcompositor
        LINUXDEPLOY_ARCH: ${{ inputs.arch }}
        LINUXDEPLOY_SHA256: ${{ inputs.arch == 'aarch64' && '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff' || 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d' }}
        QT_PLUGIN_SHA256: ${{ inputs.arch == 'aarch64' && 'bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1' || '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724' }}
        APPIMAGE_RUNTIME_SHA256: ${{ inputs.arch == 'aarch64' && '00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444' || '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d' }}
        BUILD_CHANNEL: ${{ inputs.channel }}
        PACKAGE_ARCH: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}
      run: |
        export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        mkdir -p build/qt-packages
        cmake --install build/opennow-qt-release --config Release \
          --prefix "$PWD/build/AppDir/usr"
        python3 opennow-qt/packaging/verify_linux_package.py build/AppDir/usr/bin --libdir lib
        curl --fail --location --retry 3 \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
          --output "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
        curl --fail --location --retry 3 \
          "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage" \
          --output "build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
        echo "$LINUXDEPLOY_SHA256  build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" | sha256sum --check --strict
        echo "$QT_PLUGIN_SHA256  build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage" | sha256sum --check --strict
        curl --fail --location --retry 5 --retry-all-errors --retry-max-time 300 \
          --connect-timeout 20 --max-time 120 \
          "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${LINUXDEPLOY_ARCH}" \
          --output "build/appimage-runtime-${LINUXDEPLOY_ARCH}"
        echo "$APPIMAGE_RUNTIME_SHA256  build/appimage-runtime-${LINUXDEPLOY_ARCH}" | sha256sum --check --strict
        chmod +x "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" "build/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
        install -Dm644 opennow-qt/packaging/opennow-vaapi-hook.sh \
          build/AppDir/apprun-hooks/opennow-vaapi-hook.sh
        for library in libva libva-drm; do
          install -Dm644 "$(pkg-config --variable=libdir "$library")/$library.so.2" \
            "build/AppDir/usr/lib/libva-fallback/$library.so.2"
          install -Dm644 "/usr/share/doc/${library}2/copyright" \
            "build/AppDir/usr/share/doc/${library}2/copyright"
        done
        export LDAI_UPDATE_INFORMATION
        LDAI_UPDATE_INFORMATION=$(python3 opennow-qt/packaging/appimage_updates.py information \
          --channel "$BUILD_CHANNEL" --arch "$PACKAGE_ARCH")
        QMAKE="$QT_ROOT_DIR/bin/qmake" \
        QML_SOURCES_PATHS="$PWD/opennow-qt/qml" \
        LDAI_RUNTIME_FILE="$PWD/build/appimage-runtime-${LINUXDEPLOY_ARCH}" \
        LDAI_OUTPUT="OpenNOW-Qt-${OPENNOW_BUILD_VERSION}-Linux-${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}.AppImage" \
          "build/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
            --appdir build/AppDir \
            --desktop-file build/AppDir/usr/share/applications/io.github.opencloudgaming.OpenNOW.desktop \
            --icon-file build/AppDir/usr/share/icons/hicolor/scalable/apps/io.github.opencloudgaming.OpenNOW.svg \
            --exclude-library 'libva.so.*' \
            --exclude-library 'libva-drm.so.*' \
            --exclude-library libglib-2.0.so.0 \
            --exclude-library libgobject-2.0.so.0 \
            --exclude-library libgio-2.0.so.0 \
            --exclude-library libgmodule-2.0.so.0 \
            --plugin qt \
            --output appimage
        test -f build/AppDir/usr/plugins/platforms/libqoffscreen.so
        test -f build/AppDir/usr/plugins/platforms/libqwayland-egl.so
        test -f build/AppDir/usr/plugins/platforms/libqwayland-generic.so
        test -f build/AppDir/usr/plugins/wayland-shell-integration/libxdg-shell.so
        LD_LIBRARY_PATH="$PWD/build/AppDir/usr/lib:$LD_LIBRARY_PATH" \
          python3 opennow-qt/packaging/verify_linux_package.py build/AppDir/usr/bin --libdir lib --appdir build/AppDir
        python3 opennow-qt/packaging/appimage_updates.py verify \
          --channel "$BUILD_CHANNEL" --arch "$PACKAGE_ARCH" \
          --appimage "OpenNOW-Qt-${OPENNOW_BUILD_VERSION}-Linux-${PACKAGE_ARCH}.AppImage"
        mv OpenNOW-Qt-*.AppImage OpenNOW-Qt-*.AppImage.zsync build/qt-packages/

    - name: Create bundled Linux DEB
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cpack --config build/opennow-qt-release/CPackConfig.cmake \
          -D "CPACK_PROJECT_CONFIG_FILE=$PWD/opennow-qt/packaging/LinuxBundledDeb.cmake" \
          -D "OPENNOW_APPDIR=$PWD/build/AppDir" \
          -C Release -G DEB -B build/qt-packages
        debs=(build/qt-packages/*.deb)
        [[ ${#debs[@]} -eq 1 && -f "${debs[0]}" ]]
        bash opennow-qt/packaging/verify_bundled_deb.sh "${debs[0]}"

    - name: Smoke-test Linux AppImage
      if: runner.os == 'Linux'
      shell: bash
      env:
        APPIMAGE_EXTRACT_AND_RUN: "1"
        QT_QPA_PLATFORM: offscreen
      run: |
        appimages=(build/qt-packages/OpenNOW-Qt-*.AppImage)
        [[ ${#appimages[@]} -eq 1 && -f "${appimages[0]}" ]]
        env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH \
          -u QML2_IMPORT_PATH -u QML_IMPORT_PATH -u LD_LIBRARY_PATH \
          "${appimages[0]}" \
          --smoke-test --allow-multiple-instances --route home --reduced-motion
