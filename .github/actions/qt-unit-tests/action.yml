name: Qt and Rust unit tests
description: Run native platform checks without compiling or packaging the desktop application
inputs:
  label:
    description: Platform cache identity
    required: true
  qt-host:
    description: Qt installer host
    required: true
  qt-arch:
    description: Qt installer architecture
    required: true
  target-arch:
    description: SDL target architecture
    required: true
  parallel:
    description: Maximum concurrent build jobs
    required: true
runs:
  using: composite
  steps:
    - name: Prepare Ubuntu HTTPS mirrors
      if: inputs.label == 'linux-x64'
      shell: bash
      run: sudo python3 .github/scripts/prepare-ubuntu-apt-https.py
    - name: Prepare Windows test dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .github/scripts/map-windows-workspace.ps1
        .github/scripts/windows-media-foundation-background.ps1 Start
    - name: Setup Windows build tools
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Cache Windows NASM
      if: runner.os == 'Windows'
      id: windows-nasm
      uses: actions/cache@v4
      with:
        path: C:\Program Files\NASM
        key: windows-nasm-3.2.0
    - name: Install Windows native test dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NASM_CACHE_HIT: ${{ steps.windows-nasm.outputs.cache-hit }}
      run: |
        $ErrorActionPreference = "Stop"
        .github/scripts/ensure-windows-llvm.ps1
        if ($env:NASM_CACHE_HIT -ne "true") {
          choco install nasm --version=3.2.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed with exit code $LASTEXITCODE" }
        }
        $nasmBin = Join-Path $env:ProgramFiles "NASM"
        $nasm = Join-Path $nasmBin "nasm.exe"
        if (-not (Test-Path $nasm)) {
          throw "NASM installation is missing nasm.exe"
        }
        $version = & $nasm -v
        if ($LASTEXITCODE -ne 0 -or $version -notmatch '^NASM version 3\.02(?:\s|$)') {
          throw "Expected NASM 3.02 from Chocolatey package 3.2.0, got: $version"
        }
        $nasmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
        if (-not (Test-Path $linker)) { throw "MSVC linker is unavailable" }
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Check Rust formatting
      shell: bash
      working-directory: ${{ env.OPENNOW_CHECKOUT }}
      run: |
        cargo fmt --manifest-path native/opennow-core/Cargo.toml -- --check
        cargo fmt --manifest-path native/opennow-streamer/Cargo.toml --all -- --check
    - name: Install Linux test dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo bash .github/scripts/configure-ubuntu-apt.sh
        sudo apt-get update --error-on=any
        sudo apt-get install -y \
          clang libclang-dev libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libgl1-mesa-dev \
          libpulse-dev libsecret-1-dev libva-dev libvulkan-dev libwayland-dev \
          libx11-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcursor-dev libxext-dev libxfixes-dev \
          libxi-dev libxkbcommon-dev libxkbcommon-x11-0 libxrandr-dev libxrender-dev libxss-dev \
          mesa-vulkan-drivers nasm ninja-build pkg-config wayland-protocols xvfb
    - name: Limit Rust debug info
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.3"
        host: ${{ inputs.qt-host }}
        target: desktop
        arch: ${{ inputs.qt-arch }}
        modules: qtmultimedia qtshadertools
        cache: true
        cache-key-prefix: qt-target-${{ inputs.label }}
    - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
      with:
        key: qt-checks-${{ inputs.label }}
        restore-keys: qt-checks-${{ inputs.label }}
        max-size: 1G
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        verbose: 1
    - name: Build and cache SDL3 test dependency
      uses: ./.github/actions/sdl3
      with:
        version: release-3.2.20
        target-arch: ${{ inputs.target-arch }}
        parallel: ${{ inputs.parallel }}
    - name: Cache complete Rust build state
      uses: ./.github/actions/rust-build-cache
      with:
        shared-key: qt-checks-${{ inputs.label }}
        workspaces: |
          native/opennow-core -> target
          native/opennow-streamer -> target
          native/opennow-core -> ../../build/opennow-qt-checks/rust-target
    - name: Check QML syntax
      shell: bash
      working-directory: ${{ env.OPENNOW_CHECKOUT }}
      run: find opennow-qt/qml -name '*.qml' -print0 | xargs -0 -n1 "$QT_ROOT_DIR/bin/qmlformat" > /dev/null
    - name: Lint Rust
      shell: bash
      working-directory: ${{ env.OPENNOW_CHECKOUT }}
      env:
        CARGO_BUILD_JOBS: ${{ inputs.parallel }}
      run: python .github/scripts/run-native-checks.py lint --parallel "$CARGO_BUILD_JOBS"
    - name: Build Rust and Qt tests concurrently
      shell: bash
      working-directory: ${{ env.OPENNOW_CHECKOUT }}
      env:
        CARGO_BUILD_JOBS: ${{ inputs.parallel }}
        TARGET_ARCH: ${{ inputs.target-arch }}
      run: python .github/scripts/run-native-checks.py build --parallel "$CARGO_BUILD_JOBS"
    - name: Finish Windows Media Foundation installation
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .github/scripts/windows-media-foundation-background.ps1 Wait
        .github/scripts/ensure-windows-media-foundation.ps1
    - name: Test Rust
      shell: bash
      working-directory: ${{ env.OPENNOW_CHECKOUT }}
      env:
        CARGO_BUILD_JOBS: ${{ inputs.parallel }}
      run: python .github/scripts/run-native-checks.py test --parallel "$CARGO_BUILD_JOBS"
    - name: Upload native check diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-check-diagnostics-${{ inputs.label }}
        path: |
          build/ci-native-logs
          build/opennow-qt-checks/qt-unit-tests.xml
          build/opennow-qt-checks/Testing/Temporary
          native/opennow-core/target/cargo-timings
          native/opennow-streamer/target/cargo-timings
        if-no-files-found: ignore
        retention-days: 7
