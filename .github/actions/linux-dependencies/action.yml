name: Install Linux native media dependencies
description: Install the shared Qt, input, graphics and media build and validation dependencies
inputs:
  arch:
    description: Target architecture, x86_64 or aarch64
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux media dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          libclang-dev \
          libasound2-dev \
          libdbus-1-dev \
          libdrm-dev \
          libgstreamer-plugins-bad1.0-0 \
          libgstreamer-plugins-good1.0-0 \
          libpulse-dev \
          libsecret-1-dev \
          libva-dev \
          libvulkan-dev \
          libwayland-dev \
          libx11-dev \
          libxcursor-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrandr-dev \
          libxrender-dev \
          libxss-dev \
          mesa-vulkan-drivers \
          make \
          nasm \
          pkg-config \
          wayland-protocols \
          xvfb

    - name: Install ARM64 V4L2 request dependencies
      if: inputs.arch == 'aarch64'
      shell: bash
      run: sudo apt-get install -y libudev-dev
