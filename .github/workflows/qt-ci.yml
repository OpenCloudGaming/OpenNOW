name: qt-ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: qt-target-macos-x64
      - uses: ./.github/actions/sdl3
        with:
          version: release-3.2.20
          target-arch: x86_64
          parallel: "3"
      - name: Build only the unchanged controller-input target
        run: |
          cmake -S opennow-qt -B build/probe -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"
          cmake --build build/probe --target opennow-controllerinput-tests --parallel 3
      - name: Profile native and isolated virtual-device runs
        run: python3 .github/scripts/intel-controller-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-controller-profiles
          path: build/intel-controller-profiles
