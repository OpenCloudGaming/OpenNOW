name: qt-ci

on:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish an unsigned nightly prerelease after all checks pass
        type: boolean
        default: false
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/qt-ci.yml"
      - ".github/workflows/qt-build.yml"
      - ".github/workflows/qt-checks.yml"
      - ".github/workflows/qt-release-candidate.yml"
      - ".github/actionlint.yaml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "opennow-qt/**"
      - "native/opennow-core/**"
      - "native/opennow-streamer/**"
      - "locales/**"
      - "scripts/**"
      - "package.json"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/qt-ci.yml"
      - ".github/workflows/qt-build.yml"
      - ".github/workflows/qt-checks.yml"
      - ".github/workflows/qt-release-candidate.yml"
      - ".github/actionlint.yaml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "opennow-qt/**"
      - "native/opennow-core/**"
      - "native/opennow-streamer/**"
      - "locales/**"
      - "scripts/**"
      - "package.json"

concurrency:
  group: qt-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  contracts:
    name: Shared checks
    uses: ./.github/workflows/qt-checks.yml

  checks:
    name: ${{ matrix.label }}
    needs: contracts
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: blacksmith-8vcpu-ubuntu-2404
            qt-host: linux
            qt-arch: linux_gcc_64
            target-arch: x64
            parallel: "8"
          - label: windows-x64
            os: blacksmith-8vcpu-windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            target-arch: x64
            parallel: "8"
          - label: macos-arm64
            os: blacksmith-6vcpu-macos-15
            qt-host: mac
            qt-arch: clang_64
            target-arch: arm64
            parallel: "3"
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: ${{ matrix.parallel }}
      OPENNOW_CHECKOUT: ${{ matrix.label == 'windows-x64' && 'O:/' || github.workspace }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.label == 'macos-arm64' && '13.0' || '' }}
    steps:
      - name: Require shared checks to pass
        shell: bash
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: test "$CONTRACTS_RESULT" = success
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qt-unit-tests
        with:
          label: ${{ matrix.label }}
          qt-host: ${{ matrix.qt-host }}
          qt-arch: ${{ matrix.qt-arch }}
          target-arch: ${{ matrix.target-arch }}
          parallel: ${{ matrix.parallel }}

  build:
    name: Manual packages
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    uses: ./.github/workflows/qt-build.yml
    with:
      upload_complete: ${{ github.event_name == 'workflow_dispatch' }}

  publish-nightly:
    name: Publish unsigned nightly prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nightly
    needs: [contracts, checks, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opennow-qt-${{ needs.build.outputs.version }}-complete-unsigned
          path: nightly-release
      - name: Verify checksums and prepare unsigned release notes
        shell: bash
        run: |
          (cd nightly-release && sha256sum --check --strict SHA256SUMS)
          cat > nightly-notes.md <<EOF
          Experimental OpenNOW Qt/native nightly from commit \`$SOURCE_SHA\`.

          **All packages are unsigned.** Windows may display a SmartScreen or unknown-publisher warning.
          Windows x64 and ARM64 downloads are portable ZIPs: extract the entire archive and run \`bin/OpenNOW.exe\`.
          Linux AppImages are the recommended portable download; mark the file executable before launching it.
          DEBs require a distribution providing Qt 6.8+ and SDL3; stock Ubuntu 24.04 does not satisfy those requirements.

          These builds have no pinned update-signing key and require manual downloads for updates.
          SHA256SUMS detects corrupted downloads; it is not a cryptographic publisher signature.
          macOS is not included. Windows ARM64 is cross-built, not runtime-tested by CI.
          EOF
      - name: Publish only after the complete upload succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" nightly-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "OpenNOW v$RELEASE_VERSION" --notes-file nightly-notes.md \
            --draft --prerelease --latest=false
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
