name: windows-core-crash-diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 30
    env:
      OPENNOW_CHECKOUT: O:/
      CARGO_BUILD_JOBS: '8'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 529cd1685d44c54652f47f16bce9512ae672c5b5
          persist-credentials: false
      - name: Map workspace and verify exact source
        shell: pwsh
        run: |
          .github/scripts/map-windows-workspace.ps1
          if ((git rev-parse HEAD) -ne '529cd1685d44c54652f47f16bce9512ae672c5b5') { throw 'Wrong diagnostic source' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-cache
        with:
          shared-key: qt-checks-windows-x64
          workspaces: native/opennow-core -> target
          save-if: 'false'
      - name: Serial GFN tests with uncaptured output
        id: serial
        continue-on-error: true
        shell: pwsh
        working-directory: O:/
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          cargo test --locked --manifest-path native/opennow-core/Cargo.toml --bin opennow-core gfn:: -- --test-threads=1 --nocapture 2>&1 | Tee-Object diagnostics/serial-gfn.log
          $code = $LASTEXITCODE
          "SERIAL_GFN_EXIT=$code" | Tee-Object -Append diagnostics/serial-gfn.log
          exit $code
      - name: Repeat the default-threaded binary with uncaptured output
        if: steps.serial.outcome == 'success'
        shell: pwsh
        working-directory: O:/
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo test --locked --manifest-path native/opennow-core/Cargo.toml --bin opennow-core -- --nocapture 2>&1 | Tee-Object "diagnostics/concurrent-$attempt.log"
            $code = $LASTEXITCODE
            "CONCURRENT_EXIT=$code" | Tee-Object -Append "diagnostics/concurrent-$attempt.log"
            if ($code -ne 0) { exit $code }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-core-crash-text-529cd168
          path: diagnostics/*.log
          if-no-files-found: error
          retention-days: 3
      - name: Require serial success
        if: always() && steps.serial.outcome != 'success'
        shell: pwsh
        run: exit 1
