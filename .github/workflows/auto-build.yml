name: ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  push: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-builds:
    name: select-builds
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select build matrix
        id: matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const builds = [
            {
              label: "windows-x64",
              os: "blacksmith-2vcpu-windows-2025",
              native_target: "x86_64-pc-windows-msvc",
              native_platform_key: "win32-x64",
              builder_args: "--win nsis portable --x64",
              artifact_paths: "opennow-stable/dist-release/*-x64.exe\n",
            },
            {
              label: "windows-arm64",
              os: "blacksmith-2vcpu-windows-2025",
              native_target: "aarch64-pc-windows-msvc",
              native_platform_key: "win32-arm64",
              builder_args: "--win nsis portable --arm64",
              artifact_paths: "opennow-stable/dist-release/*-arm64.exe\n",
            },
            {
              label: "macos-x64",
              os: "blacksmith-6vcpu-macos-15",
              native_target: "x86_64-apple-darwin",
              native_platform_key: "darwin-x64",
              builder_args: "--mac dmg zip --x64",
              artifact_paths:
                "opennow-stable/dist-release/*.dmg\n" +
                "opennow-stable/dist-release/*-x64.zip\n",
            },
            {
              label: "macos-arm64",
              os: "blacksmith-6vcpu-macos-15",
              native_target: "aarch64-apple-darwin",
              native_platform_key: "darwin-arm64",
              builder_args: "--mac dmg zip --arm64",
              artifact_paths:
                "opennow-stable/dist-release/*.dmg\n" +
                "opennow-stable/dist-release/*-arm64.zip\n",
            },
            {
              label: "linux-x64",
              os: "blacksmith-2vcpu-ubuntu-2404",
              native_target: "x86_64-unknown-linux-gnu",
              native_platform_key: "linux-x64",
              builder_args: "--linux AppImage deb --x64",
              artifact_paths:
                "opennow-stable/dist-release/*-x86_64.AppImage\n" +
                "opennow-stable/dist-release/*-amd64.deb\n",
            },
            {
              label: "linux-arm64",
              os: "blacksmith-2vcpu-ubuntu-2404-arm",
              native_target: "aarch64-unknown-linux-gnu",
              native_platform_key: "linux-arm64",
              builder_args: "--linux AppImage deb --arm64",
              artifact_paths:
                "opennow-stable/dist-release/*-arm64.AppImage\n" +
                "opennow-stable/dist-release/*-arm64.deb\n",
            },
          ];

          const eventName = process.env.GITHUB_EVENT_NAME;
          const baseRef = process.env.GITHUB_BASE_REF;
          const isPullRequest = eventName === "pull_request";
          const isDevValidationPullRequest = isPullRequest && baseRef === "dev";
          const include = isDevValidationPullRequest
            ? builds.filter(({ label }) =>
                label === "windows-x64"
                || label === "macos-x64"
                || label === "macos-arm64"
                || label === "linux-x64"
                || label === "linux-arm64")
            : builds;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: select-builds
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}

    defaults:
      run:
        working-directory: opennow-stable

    env:
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Windows Media Foundation
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: .github/scripts/ensure-windows-media-foundation.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opennow-stable/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.native_target }}

      - name: Install Linux native streamer build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libdrm-dev \
            libpulse-dev \
            libva-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            make \
            nasm \
            pkg-config

      - name: Install Linux ARM64 cross compiler
        if: matrix.label == 'linux-arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Install Windows ARM64 compiler
        if: matrix.native_target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installPath = & "$installerRoot\vswhere.exe" -latest -products * -property installationPath
          if (-not $installPath) {
            throw "Visual Studio Build Tools installation was not found."
          }
          $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            $arguments = "modify --installPath `"$installPath`" --quiet --norestart --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $install = Start-Process "$installerRoot\vs_installer.exe" -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -notin 0, 3010) {
              throw "Visual Studio ARM64 compiler installation failed with exit code $($install.ExitCode)."
            }
            $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $compiler) {
            throw "Visual Studio ARM64 compiler is unavailable after installation."
          }
          $linker = Join-Path $compiler.Directory.FullName "link.exe"
          if (-not (Test-Path $linker)) {
            throw "Visual Studio ARM64 linker is unavailable after installation."
          }
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Windows ARM64 compiler: $($compiler.FullName)"
          Write-Host "Using Windows ARM64 linker: $linker"

      - name: Setup Windows ARM64 build tools
        if: matrix.native_target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "clang.exe")) -or
              -not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "LLVM installation is missing libclang.dll"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pin CMake for bundled SDL2
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install --disable-pip-version-check cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test
        id: test
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Test and build native streamer v2
        shell: bash
        env:
          OPENNOW_NATIVE_STREAMER_TARGET: ${{ matrix.native_target }}
          OPENNOW_NATIVE_STREAMER_PLATFORM_KEY: ${{ matrix.native_platform_key }}
        run: |
          cargo fmt --manifest-path ../native/opennow-streamer/Cargo.toml --all -- --check
          cargo clippy --manifest-path ../native/opennow-streamer/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path ../native/opennow-streamer/Cargo.toml --workspace
          npm run native:build

      - name: CI summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success) printf '✅ success' ;;
              failure) printf '❌ failure' ;;
              cancelled) printf '❌ cancelled' ;;
              skipped) printf '⏭️ skipped' ;;
              *) printf '❌ %s' "$1" ;;
            esac
          }

          {
            echo "## CI Summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Format | ⏭️ skipped/not configured |"
            echo "| Lint | $(status_icon '${{ steps.lint.outcome }}') |"
            echo "| Typecheck | $(status_icon '${{ steps.typecheck.outcome }}') |"
            echo "| Test | $(status_icon '${{ steps.test.outcome }}') |"
            echo "| Browser Test | ⏭️ skipped/not configured |"
            echo "| Build | $(status_icon '${{ steps.build.outcome }}') |"
            echo
            echo "Job summary generated at run-time"
          } >> "$GITHUB_STEP_SUMMARY"
