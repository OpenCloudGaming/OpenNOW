name: Qt Flatpak build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Flatpak architecture
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'aarch64' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build architecture
        env:
          FLATPAK_ARCH: ${{ inputs.arch }}
        run: test "$(uname -m)" = "$FLATPAK_ARCH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Flatpak tools and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.10 org.kde.Sdk//6.10 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08
      - name: Test packaging contracts and vendor locked Rust dependencies
        run: |
          python3 -m unittest discover -s opennow-qt/tests -p test_flatpak.py
          python3 opennow-qt/packaging/flatpak/prepare_sources.py
      - name: Build without network access and export bundle
        run: |
          flatpak-builder --user --force-clean --jobs=4 \
            --state-dir=build/flatpak/state --repo=build/flatpak/repo \
            build/flatpak/app opennow-qt/packaging/flatpak/io.github.opencloudgaming.OpenNOW.json
          flatpak build-bundle build/flatpak/repo build/flatpak/OpenNOW-${{ inputs.arch }}.flatpak \
            io.github.opencloudgaming.OpenNOW master \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - name: Install and verify the exported bundle
        run: |
          flatpak install --user --noninteractive -y build/flatpak/OpenNOW-${{ inputs.arch }}.flatpak
          test "$(flatpak info --user --show-arch io.github.opencloudgaming.OpenNOW)" = "${{ inputs.arch }}"
          python3 opennow-qt/packaging/verify_flatpak.py
      - uses: actions/upload-artifact@v4
        with:
          name: opennow-qt-flatpak-${{ inputs.arch }}
          path: build/flatpak/OpenNOW-${{ inputs.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
