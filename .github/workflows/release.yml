name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publish a stable release or a test-only nightly from dev
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: Target version (for a nightly, use the next stable version, e.g. 1.2.3)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
      - "opennow-stable-v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_type: ${{ steps.release.outputs.release_type }}
      release_name: ${{ steps.release.outputs.release_name }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}

    steps:
      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "dev" ]]; then
            echo "Manual releases must be dispatched from the dev branch." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/dev' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opennow-stable/package-lock.json

      - name: Install dependencies
        working-directory: opennow-stable
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Typecheck
        working-directory: opennow-stable
        run: npm run typecheck --if-present

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_type="${RELEASE_TYPE:-stable}"
          raw="${INPUT_VERSION:-$REF_NAME}"
          case "$raw" in
            opennow-stable-v*) version="${raw#opennow-stable-v}" ;;
            v*) version="${raw#v}" ;;
            *) version="$raw" ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: $raw" >&2
            exit 1
          fi

          release_name="OpenNOW v${version}"
          if [[ "$release_type" == "nightly" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$REF_TYPE" != "branch" || "$REF_NAME" != "dev" ]]; then
              echo "Nightly releases must be manually dispatched from the dev branch." >&2
              exit 1
            fi
            if [[ "$version" == *-* || "$version" == *+* ]]; then
              echo "Nightly target version must be a stable semver such as 1.2.3; the nightly suffix is added automatically." >&2
              exit 1
            fi
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            latest_version="${latest_tag#opennow-stable-v}"
            latest_version="${latest_version#v}"
            if [[ "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              highest_version="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)"
              if [[ "$version" == "$latest_version" || "$highest_version" != "$version" ]]; then
                echo "Nightly target $version must be newer than the latest stable release $latest_version." >&2
                exit 1
              fi
            fi
            version="${version}-nightly.${RUN_NUMBER}.${RUN_ATTEMPT}"
            release_name="OpenNOW Nightly v${version}"
          elif [[ "$release_type" != "stable" ]]; then
            echo "Unsupported release type: $release_type" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          make_latest=true
          if [[ "$prerelease" == true ]]; then
            make_latest=false
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="v${version}"
          else
            release_tag="$raw"
          fi

          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          previous_tag="$(jq -r \
            --arg release_tag "$release_tag" \
            --arg release_type "$release_type" '
              [ .[][] ] as $releases
              | ($releases | map(select(.tag_name == $release_tag)) | first | .created_at) as $current_created_at
              | ($releases | map(select(
                  .draft == false
                  and .tag_name != $release_tag
                  and ($current_created_at == null or .created_at < $current_created_at)
                ))) as $eligible
              | (if $release_type == "nightly" then
                   ($eligible | map(select(
                     .prerelease == true
                     and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))
                   )) | first)
                   // ($eligible | map(select(.prerelease == false)) | first)
                 else
                   ($eligible | map(select(.prerelease == false)) | first)
                 end)
              | .tag_name // empty
            ' <<< "$release_pages")"

          if [[ -n "$previous_tag" ]]; then
            echo "Release notes will compare $previous_tag...$release_tag"
          else
            echo "No previous release tag found; release notes will include the full history."
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
            echo "release_tag=$release_tag"
            echo "release_type=$release_type"
            echo "release_name=$release_name"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  prepare-source:
    name: prepare-source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: preflight
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/dev' || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync or validate release version
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TYPE: ${{ needs.preflight.outputs.release_type }}
        run: |
          if [[ "$RELEASE_TYPE" == "nightly" ]]; then
            echo "Nightly version is applied only inside build jobs; dev remains unchanged."
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            node opennow-stable/scripts/sync-release-version.mjs --check "$RELEASE_VERSION"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "workflow_dispatch releases must run from a branch so the version bump can be committed before tagging." >&2
            exit 1
          fi

          node opennow-stable/scripts/sync-release-version.mjs "$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opennow-stable/package.json opennow-stable/package-lock.json
          if git diff --cached --quiet; then
            echo "No version bump changes to commit."
          else
            git commit -m "chore(release): prepare v${RELEASE_VERSION}"
            git push origin HEAD:dev
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs:
      - preflight
      - prepare-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: blacksmith-4vcpu-windows-2025
            builder_args: "--win nsis portable --x64"
            native_build: "true"
            native_target: "x86_64-pc-windows-msvc"
            native_platform_key: "win32-x64"
            artifact_paths: |
              opennow-stable/dist-release/*-x64.exe
              opennow-stable/dist-release/latest*.yml
              opennow-stable/dist-release/*.blockmap
          - label: windows-arm64
            os: blacksmith-4vcpu-windows-2025
            builder_args: "--win nsis portable --arm64"
            native_build: "true"
            native_target: "aarch64-pc-windows-msvc"
            native_platform_key: "win32-arm64"
            artifact_paths: |
              opennow-stable/dist-release/*-arm64.exe
          - label: macos-x64
            os: blacksmith-6vcpu-macos-15
            builder_args: "--mac dmg zip --x64"
            native_build: "true"
            native_target: "x86_64-apple-darwin"
            native_platform_key: "darwin-x64"
            arch: x64
            artifact_paths: |
              opennow-stable/dist-release/*.dmg
              opennow-stable/dist-release/*-x64.zip
              opennow-stable/dist-release/latest-mac.yml
          - label: macos-arm64
            os: blacksmith-6vcpu-macos-15
            builder_args: "--mac dmg zip --arm64"
            native_build: "true"
            native_target: "aarch64-apple-darwin"
            native_platform_key: "darwin-arm64"
            arch: arm64
            artifact_paths: |
              opennow-stable/dist-release/*.dmg
              opennow-stable/dist-release/*-arm64.zip
              opennow-stable/dist-release/latest-mac-arm64.yml
          - label: linux-x64
            os: blacksmith-4vcpu-ubuntu-2404
            builder_args: "--linux AppImage deb --x64"
            native_build: "true"
            native_target: "x86_64-unknown-linux-gnu"
            native_platform_key: "linux-x64"
            artifact_paths: |
              opennow-stable/dist-release/*-x86_64.AppImage
              opennow-stable/dist-release/*-amd64.deb
              opennow-stable/dist-release/latest-linux.yml
          - label: linux-arm64
            os: blacksmith-4vcpu-ubuntu-2404-arm
            builder_args: "--linux AppImage deb --arm64"
            native_build: "true"
            native_target: "aarch64-unknown-linux-gnu"
            native_platform_key: "linux-arm64"
            artifact_paths: |
              opennow-stable/dist-release/*-arm64.AppImage
              opennow-stable/dist-release/*-arm64.deb
              opennow-stable/dist-release/latest-linux-arm64.yml

    defaults:
      run:
        working-directory: opennow-stable

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      npm_config_audit: "false"
      npm_config_fund: "false"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      USE_SYSTEM_FPM: ${{ matrix.label == 'linux-arm64' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/dev' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opennow-stable/package-lock.json

      - name: Setup Rust
        if: matrix.native_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native streamer build dependencies
        if: matrix.native_build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev

      - name: Install Windows ARM64 compiler
        if: matrix.native_target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerRoot = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $installPath = & "$installerRoot\vswhere.exe" -latest -products * -property installationPath
          if (-not $installPath) {
            throw "Visual Studio Build Tools installation was not found."
          }
          $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            $arguments = "modify --installPath `"$installPath`" --quiet --norestart --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $install = Start-Process "$installerRoot\vs_installer.exe" -ArgumentList $arguments -Wait -PassThru
            if ($install.ExitCode -notin 0, 3010) {
              throw "Visual Studio ARM64 compiler installation failed with exit code $($install.ExitCode)."
            }
            $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $compiler) {
            throw "Visual Studio ARM64 compiler is unavailable after installation."
          }
          Write-Host "Using Windows ARM64 compiler: $($compiler.FullName)"

      - name: Setup Windows ARM64 build tools
        if: matrix.native_target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Pin CMake for bundled SDL2
        if: matrix.native_build == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install --disable-pip-version-check cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust target
        if: matrix.native_build == 'true' && matrix.native_target != ''
        run: rustup target add ${{ matrix.native_target }}

      - name: Cache Rust native build
        if: matrix.native_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/opennow-streamer/target
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('native/opennow-streamer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-cargo-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install FPM for arm64 deb builds
        if: matrix.label == 'linux-arm64'
        run: sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install fpm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Sync package version
        shell: bash
        run: node scripts/sync-release-version.mjs "$RELEASE_VERSION"

      - name: Verify macOS Cargo network trust
        if: matrix.native_build == 'true' && runner.os == 'macOS'
        run: |
          if [ -f /etc/ssl/cert.pem ]; then
            cargo_cacert=/etc/ssl/cert.pem
          else
            cargo_cacert="$RUNNER_TEMP/cargo-cacert.pem"
            security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain /Library/Keychains/System.keychain > "$cargo_cacert"
          fi
          echo "CARGO_HTTP_CAINFO=$cargo_cacert" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$cargo_cacert" >> "$GITHUB_ENV"
          if ! curl --fail --location --retry 5 https://index.crates.io/config.json --output /tmp/cargo-index-config.json; then
            if command -v brew >/dev/null 2>&1; then
              brew update --quiet
              brew reinstall ca-certificates
            fi
            curl --fail --location --retry 5 https://index.crates.io/config.json --output /tmp/cargo-index-config.json
          fi
          CARGO_HTTP_CAINFO="$cargo_cacert" SSL_CERT_FILE="$cargo_cacert" cargo search base64 --limit 1 >/tmp/cargo-search-check.txt

      - name: Build native streamer
        if: matrix.native_build == 'true'
        env:
          OPENNOW_NATIVE_STREAMER_TARGET: ${{ matrix.native_target }}
          OPENNOW_NATIVE_STREAMER_PLATFORM_KEY: ${{ matrix.native_platform_key }}
        run: npm run native:build

      - name: Build app bundles
        run: npm run build

      - name: Package installers
        run: npx electron-builder --publish never ${{ matrix.builder_args }}

      - name: Verify macOS code signatures
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist-release/mac*/OpenNOW.app

      - name: Rename macOS update feed
        if: matrix.arch == 'arm64'
        shell: bash
        run: mv dist-release/latest-mac.yml dist-release/latest-mac-arm64.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennow-stable-${{ matrix.label }}
          # electron-updater still consumes a single Windows latest.yml feed.
          # Keep that metadata x64-only so ARM64 release assets cannot overwrite it.
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    name: publish-release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - preflight
      - prepare-source
      - build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge macOS update feeds
        shell: bash
        run: |
          set -euo pipefail

          x64_feed=release-artifacts/latest-mac.yml
          arm64_feed=release-artifacts/latest-mac-arm64.yml

          for feed in "$x64_feed" "$arm64_feed"; do
            [ -s "$feed" ] || { echo "Missing macOS update feed: $feed" >&2; exit 1; }
            grep -q '^files:' "$feed" || { echo "Missing files block in $feed" >&2; exit 1; }
          done

          x64_ver=$(awk '/^version:/{print $2; exit}' "$x64_feed")
          arm64_ver=$(awk '/^version:/{print $2; exit}' "$arm64_feed")
          [ -n "$x64_ver" ] && [ -n "$arm64_ver" ] || { echo "Missing macOS update feed version." >&2; exit 1; }
          [ "$x64_ver" != "$arm64_ver" ] && { echo "Version mismatch: x64=$x64_ver arm64=$arm64_ver" >&2; exit 1; }
          awk '
            FNR == NR {
              if (/^files:/) { in_arm64_files=1; next }
              if (in_arm64_files && /^[^ ]/) in_arm64_files=0
              if (in_arm64_files) arm64_files=arm64_files $0 "\n"
              next
            }
            /^files:/ { in_x64_files=1; print; next }
            in_x64_files && /^[^ ]/ && !inserted {
              printf "%s", arm64_files
              inserted=1
              in_x64_files=0
            }
            { print }
            END {
              if (arm64_files == "") {
                print "Missing arm64 files block entries." > "/dev/stderr"
                exit 1
              }
              if (in_x64_files && !inserted) {
                printf "%s", arm64_files
                inserted=1
              }
              if (!inserted) {
                print "Missing x64 files block insertion point." > "/dev/stderr"
                exit 1
              }
            }
          ' "$arm64_feed" "$x64_feed" > /tmp/merged.yml
          mv /tmp/merged.yml "$x64_feed"
          rm "$arm64_feed"

      - name: Generate GitHub release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-source.outputs.release_sha }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(
            --method POST
            "repos/${RELEASE_REPOSITORY}/releases/generate-notes"
            --raw-field "tag_name=${RELEASE_TAG}"
            --raw-field "target_commitish=${RELEASE_SHA}"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--raw-field "previous_tag_name=${PREVIOUS_TAG}")
          fi
          gh api "${args[@]}" --jq .body > release-notes.md

      - name: Stage GitHub release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          target_commitish: ${{ needs.prepare-source.outputs.release_sha }}
          name: ${{ needs.preflight.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          body_path: release-notes.md
          files: release-artifacts/**/*

      - name: Publish completed GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          args=(release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" "--draft=false" "--prerelease=$PRERELEASE")
          if [[ "$MAKE_LATEST" == "true" ]]; then
            args+=(--latest)
          fi
          gh "${args[@]}"

  finalize:
    name: finalize-version-bump
    if: needs.preflight.outputs.release_type != 'nightly'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - preflight
      - release
    permissions:
      contents: write

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/dev' || 'refs/heads/main' }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update package version
        working-directory: opennow-stable
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opennow-stable/package.json
          if git diff --cached --quiet; then
            echo "No version bump changes to commit."
            exit 0
          fi
          git commit -m "chore(release): prepare v${{ needs.preflight.outputs.version }}"
          git push origin HEAD:${{ steps.branch.outputs.branch }}
