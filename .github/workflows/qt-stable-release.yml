name: Qt update-signed stable release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed main commit built by the production candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful qt-release-candidate run to promote without rebuilding
        required: true
        type: string

concurrency:
  group: qt-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact main revision
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          version=$(python3 opennow-qt/packaging/nightly_release.py version \
            --run "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" --channel stable)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  contracts:
    needs: preflight
    uses: ./.github/workflows/qt-checks.yml

  checks:
    needs: contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: blacksmith-8vcpu-ubuntu-2404
            qt-host: linux
            qt-arch: linux_gcc_64
            target-arch: x64
            parallel: "8"
          - label: windows-x64
            os: blacksmith-8vcpu-windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            target-arch: x64
            parallel: "8"
          - label: macos-arm64
            os: blacksmith-6vcpu-macos-15
            qt-host: mac
            qt-arch: clang_64
            target-arch: arm64
            parallel: "3"
    env:
      CARGO_TERM_COLOR: always
      OPENNOW_CHECKOUT: ${{ matrix.label == 'windows-x64' && 'O:/' || github.workspace }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.label == 'macos-arm64' && '13.0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qt-unit-tests
        with:
          label: ${{ matrix.label }}
          qt-host: ${{ matrix.qt-host }}
          qt-arch: ${{ matrix.qt-arch }}
          target-arch: ${{ matrix.target-arch }}
          parallel: ${{ matrix.parallel }}

  publish:
    needs: [preflight, contracts, checks]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: qt-production-release
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable candidate provenance
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          python3 opennow-qt/packaging/promote_candidate.py provenance \
            --run candidate-run.json --run-id "$CANDIDATE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: opennow-qt-${{ needs.preflight.outputs.version }}-complete-candidate
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signatures and prepare complete release inventory
        run: |
          python3 opennow-qt/packaging/promote_candidate.py assemble \
            --source candidate --destination release \
            --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
          (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Prepare public release notes
        run: |
          cat > release-notes.md <<EOF
          OpenNOW $RELEASE_VERSION uses Qt Quick and a native Rust streaming engine.

          Updates are authenticated with signed Ed25519 manifests. The Apple Silicon macOS packages require macOS 13+ and are Developer ID-signed and notarized. Windows platform signing follows the candidate's windowsSigningMode recorded in RELEASE-INFO.json; unsigned Windows packages may trigger SmartScreen.
          Older builds without the production update key (including v1.0.0) require one manual installation to enable verified updates.
          Linux AppImages include embedded update information and .zsync sidecars for external delta-update tools. Make the AppImage executable before launching.
          DEBs bundle Qt and SDL3; install with \`sudo apt install ./OpenNOW-Qt-$RELEASE_VERSION-Linux-x64.deb\` (use arm64 on ARM systems) to install system dependencies, including pkexec for update authorization.

          Intel macOS is not included. Windows ARM64 is cross-built, not runtime-tested by CI. Hardware-specific gameplay acceptance is not implied by CI passing.
          **Known issue: Alliance Partners may not work correctly.**
          SHA256SUMS detects corrupted downloads; update manifests authenticate the exact asset bytes.

          Source commit: \`$SOURCE_SHA\`. Production candidate run: \`$CANDIDATE_RUN_ID\`.
          EOF
      - name: Upload as draft before publishing the complete release
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "OpenNOW v$RELEASE_VERSION" --notes-file release-notes.md \
            --draft --latest=false
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest
