<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>GeForce NOW Linux payload: static binary audit</title>
<style>
:root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --border:#30363d; }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
.layout { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
nav { position:sticky; top:0; height:100vh; overflow:auto; padding:1.25rem; border-right:1px solid var(--border); background:#010409; }
nav h2 { font-size:0.85rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 .75rem; }
nav ul { list-style:none; padding:0; margin:0; }
nav a { color:var(--accent); text-decoration:none; display:block; padding:.35rem 0; font-size:.92rem; }
main { padding:2rem 2.5rem 4rem; max-width:960px; }
section { margin-bottom:3.5rem; padding-bottom:2rem; border-bottom:1px solid var(--border); }
.section-title { font-size:1.75rem; margin-top:0; }
h1,h2,h3 { color:#f0f6fc; }
code, pre { background:#161b22; border:1px solid var(--border); border-radius:6px; }
pre { padding:1rem; overflow:auto; font-size:0.85rem; }
table { border-collapse:collapse; width:100%; margin:1rem 0; font-size:0.9rem; }
th, td { border:1px solid var(--border); padding:.45rem .6rem; }
th { background:#161b22; }
.header-meta { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
@media (max-width:900px) { .layout { grid-template-columns:1fr; } nav { height:auto; position:relative; } }
</style>
</head>
<body>
<div class="layout">
<nav><h2>GFN binary audit</h2><p class="header-meta">Linux Flatpak · gs_04_87</p><ul>{{navigation}}</ul></nav>

</div></body></html>
